main_table:
  caption: "Baseline difference-in-differences — productivity declines after sports-betting legalization (Table 3)"
  columns:
    - header: ""
      align: left
    - header: "(1)"
      align: center
    - header: "(2)"
      align: center
    - header: "(3)"
      align: center
    - header: "(4)"
      align: center
  rows:
    - ["Post × Treat", "−0.030", "−0.030", "−0.030", "−0.030"]
    - ["", "(0.009)", "(0.009)", "(0.009)", "(0.009)"]
    - ["Firm FE", "Yes", "Yes", "Yes", "Yes"]
    - ["Year FE", "Yes", "Yes", "Yes", "Yes"]
    - ["State GDP growth", "", "Yes", "Yes", "Yes"]
    - ["State unemployment", "", "", "Yes", "Yes"]
    - ["Industry trends", "", "", "", "Yes"]
    - ["Observations", "34,868", "34,868", "34,868", "34,868"]
  notes: >
    Dependent variable: log(total sales / total employees). Post is an indicator
    equal to one in years following a state's online sports-betting launch.
    Standard errors clustered by state in parentheses. The treatment coefficient
    is stable across control specifications, indicating productivity at treated
    firms is approximately 3.0% lower than controls following launch.

