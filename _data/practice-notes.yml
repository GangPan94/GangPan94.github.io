- title: "Using an Excel agent to clean, validate, and reconcile data"
  authors: '**Gang (Ernest) Pan**, Ph.D. and **Li Wang**, CPA/ABV, Ph.D., University of Akron.'
  status: "Forthcoming, Journal of Accountancy"
  date: 2026-08-16
  excerpt: 'Excel-integrated AI tools, or "Excel agents," such as ChatGPT for Excel, Claude for Excel, and DataSnipper, are converging in functionality and offer a practical, low-resistance entry point for AI adoption in accounting. Because they operate within the familiar Excel environment, they require no coding skills or external analytics platforms. This article demonstrates a five-step workflow in which an Excel agent, equipped with a custom audit-focused skill, cleans, validates, and reconciles 59,157 rows of unstructured general ledger data to the trial balance in about 10 minutes. The process emphasizes human-in-the-loop oversight: the agent presents a cleaning plan for approval before execution, uses only native Excel formulas, maintains a modification log as an audit trail, and generates plain-English documentation for reviewer inspection. The approach extends beyond audit to tax compliance, financial reporting, and reconciliation tasks across accounting functions.'